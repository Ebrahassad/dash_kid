name: Build Pepsi Runner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Java 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 3. Flutter 3.24.5
      # ==========================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true


      # ==========================================================
      # 4. Verify environment
      # ==========================================================

      - name: Verify environment
        run: |
          set -e

          flutter --version
          dart --version
          java -version
          flutter doctor -v


      # ==========================================================
      # 5. Verify Pepsi Runner project
      # ==========================================================

      - name: Verify project
        run: |
          set -e

          test -f pubspec.yaml
          test -d lib
          test -d assets
          test -d android

          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

          echo "=========================================="
          echo "Pepsi Runner project verified."
          echo "=========================================="


      # ==========================================================
      # 6. Create CI local.properties
      # ==========================================================

      - name: Create Android local.properties
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

          echo "local.properties created."


      # ==========================================================
      # 7. Configure Gradle Wrapper 8.3
      # ==========================================================

      - name: Configure Gradle Wrapper 8.3
        run: |
          set -e

          mkdir -p android/gradle/wrapper

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-all.zip
          EOF

          echo "=========================================="
          echo "Gradle wrapper configured:"
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=========================================="


      # ==========================================================
      # 8. Generate Gradle Wrapper using Gradle 8.3
      # ==========================================================

      - name: Generate Gradle Wrapper using Gradle 8.3
        run: |
          set -e

          cd android

          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.3-bin.zip \
            -o /tmp/gradle-8.3-bin.zip

          mkdir -p /tmp/gradle-8.3

          unzip -q \
            /tmp/gradle-8.3-bin.zip \
            -d /tmp/gradle-8.3

          /tmp/gradle-8.3/gradle-8.3/bin/gradle wrapper \
            --gradle-version 8.3

          cd ..

          chmod +x android/gradlew

          echo "=========================================="
          echo "Gradle Wrapper generated."
          echo "=========================================="

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Wrapper files verified."


      # ==========================================================
      # 9. Verify actual Gradle version
      # ==========================================================

      - name: Verify Gradle Wrapper version
        run: |
          set -e

          cd android

          ./gradlew --version

          cd ..


      # ==========================================================
      # 10. Flutter dependencies
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================================
      # 11. Check Unity Ads dependency
      # ==========================================================

      - name: Check Unity Ads dependency
        run: |
          if flutter pub deps | grep -qi unity_ads_plugin; then
            echo "Unity Ads dependency found."
          else
            echo "INFO: unity_ads_plugin is not currently in pubspec.yaml."
          fi


      # ==========================================================
      # 12. Decode release keystore
      # ==========================================================

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Release keystore decoded successfully."


      # ==========================================================
      # 13. Create key.properties
      # ==========================================================

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ==========================================================
      # 14. Flutter clean
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 15. Flutter pub get after clean
      # ==========================================================

      - name: Flutter pub get after clean
        run: flutter pub get


      # ==========================================================
      # 16. Generate launcher icons
      # ==========================================================

      - name: Generate launcher icons
        run: |
          set -e

          dart run flutter_launcher_icons

          echo "=========================================="
          echo "Launcher icons generated successfully."
          echo "=========================================="


      # ==========================================================
      # 17. Flutter analyze
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true


      # ==========================================================
      # 18. Flutter tests
      # ==========================================================

      - name: Flutter test
        run: flutter test


      # ==========================================================
      # 19. Build Release APK
      # ==========================================================

      - name: Build Release APK
        run: |
          set -e

          flutter build apk --release


      # ==========================================================
      # 20. Verify APK
      # ==========================================================

      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "=========================================="
          echo "PEPSI RUNNER APK BUILT SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================================
      # 21. Upload APK to GitHub Actions
      # ==========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pepsi-runner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30